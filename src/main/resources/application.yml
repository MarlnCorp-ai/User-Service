    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
server:
  port: 8090

eureka:
  client:
    fetch-registry: true
    service-url:
      defaultZone: http://ec2-40-172-116-146.me-central-1.compute.amazonaws.com:8761/eureka

logging:
