spring:
  application:
    name: marln-user-service

  datasource:
    platform: postgres
    url: jdbc:postgresql://marln-trial-database.c5ew6uekogft.me-central-1.rds.amazonaws.com:5432/postgres
    username: marlntrial
    password: Mangaldoi#25
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user_data
    show-sql: true

  flyway:
